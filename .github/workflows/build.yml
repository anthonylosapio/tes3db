name: Build tes3db
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive_name: tes3db-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            archive_name: tes3db-linux-x64.tar.gz
          - os: macos-latest
            rid: osx-x64
            archive_name: tes3db-osx-x64.tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive_name: tes3db-osx-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish to folder
        run: dotnet publish --configuration Release --output ./publish --self-contained true -r ${{ matrix.rid }}

      - name: Zip output (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
        run: Compress-Archive -Path ./publish/* -DestinationPath ./${{ matrix.archive_name }}

      - name: Zip output (Linux/macOS)
        if: startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows-latest'
        run: tar -czf ./${{ matrix.archive_name }} -C ./publish .

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
