name: Build tes3db
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish to folder
        run: dotnet publish --no-restore --configuration Release --output ./publish --self-contained false

      - name: Zip published output
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path ./publish/* -DestinationPath ./tes3db.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ./tes3db.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
